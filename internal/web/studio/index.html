                                var inp = item.querySelector('input');
                                value = (inp.min !== '') ? parseInt(inp.min) : 0;
                            }
                            break;
                    }
                    configs[key] = { value: value };
                });

                fetch('/studio/config?file=' + encodeURIComponent(s.file), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(configs)
                }).then(function (r) { return r.json(); }).then(function (data) {
                    if (data.ok) closeModal('settingsModal');
                });
            }

            function showDelete() {
                var s = currentScripts[contextTarget];
                if (!s) return;
                $('deleteContent').innerHTML = '<p>确定要删除脚本 <strong>' + escHtml(s.name || s.file) + '</strong> 吗？此操作不可撤销。</p>';
                openModal('deleteModal');
            }

            function confirmDelete() {
                var s = currentScripts[contextTarget];
                if (!s) return;
                fetch('/studio/script?file=' + encodeURIComponent(s.file), { method: 'DELETE' })
                    .then(function (r) { return r.json(); }).then(function (data) {
                        if (data.ok) {
                            closeModal('deleteModal');
                            refreshAfterDelete();
                            loadScripts();
                        }
                    });
            }

            function openModal(id) {
                $(id).classList.add('active');
                document.body.style.overflow = 'hidden';
            }
            function closeModal(id) {
                $(id).classList.remove('active');
                document.body.style.overflow = '';
            }
            window.openModal = openModal;
            window.closeModal = closeModal;
            // 点击遮罩关闭
            document.querySelectorAll('.modal-overlay').forEach(function (ov) {
                ov.addEventListener('click', function (e) {
                    if (e.target === ov) closeModal(ov.id);
                });
            });

            // ===== 拖拽排序 =====
            var dragIdx = -1, overIdx = -1, dragListenersBound = false;

            function setupDragDrop() {
                dragIdx = -1;
                overIdx = -1;

                var items = scriptList.querySelectorAll('.script-item');
                items.forEach(function (item) {
                    var handle = item.querySelector('.drag-handle');
                    if (!handle) return;

                    handle.addEventListener('touchstart', function (e) {
                        dragIdx = parseInt(item.dataset.index);
                        item.classList.add('dragging');
                        e.preventDefault();
                    }, { passive: false });

                    handle.addEventListener('mousedown', function (e) {
                        dragIdx = parseInt(item.dataset.index);
                        item.classList.add('dragging');
                        e.preventDefault();
                    });
                });

                // 列表级事件只绑定一次，避免每次渲染重复注册。
                if (dragListenersBound) return;
                dragListenersBound = true;

                scriptList.addEventListener('touchmove', function (e) {
                    if (dragIdx < 0) return;
                    var touch = e.touches[0];
                    var target = document.elementFromPoint(touch.clientX, touch.clientY);
                    var overItem = target ? target.closest('.script-item') : null;
                    if (overItem) {
                        document.querySelectorAll('.script-item').forEach(function (it) { it.classList.remove('drag-over'); });
                        overItem.classList.add('drag-over');
                        overIdx = parseInt(overItem.dataset.index);
                    }
                    e.preventDefault();
                }, { passive: false });

                scriptList.addEventListener('mousemove', function (e) {
                    if (dragIdx < 0) return;
                    document.querySelectorAll('.script-item').forEach(function (it) { it.classList.remove('drag-over'); });
                    var overItem = e.target.closest('.script-item');
                    if (overItem) {
                        overItem.classList.add('drag-over');
                        overIdx = parseInt(overItem.dataset.index);
                    }
                });

                function endDrag() {
                    if (dragIdx >= 0 && overIdx >= 0 && dragIdx !== overIdx) {
                        var moved = currentScripts.splice(dragIdx, 1)[0];
                        currentScripts.splice(overIdx, 0, moved);
                        mergeOrderIntoAllScripts();
                        saveOrder();
                        renderScriptList();
                        setupDragDrop();
                    }
                    document.querySelectorAll('.script-item').forEach(function (it) { it.classList.remove('dragging', 'drag-over'); });
                    dragIdx = -1;
                    overIdx = -1;
                }

                scriptList.addEventListener('touchend', endDrag);
                scriptList.addEventListener('mouseup', endDrag);
            }

            // 将当前分类的排序合并回全局顺序，保留另一分类的相对位置。
            function mergeOrderIntoAllScripts() {
                var queue = currentScripts.slice();
                var merged = [];
                allScripts.forEach(function (s) {
                    if (s.type === currentTab) {
                        if (queue.length) merged.push(queue.shift());
                    } else {
                        merged.push(s);
                    }
                });
                while (queue.length) merged.push(queue.shift());
                allScripts = merged;
            }

            function saveOrder() {
                var files = allScripts.map(function (s) { return s.file; });
                fetch('/studio/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files: files })
                });
            }

            function refreshAfterDelete() {
                currentScripts = [];
                loadScripts();
            }

            // ===== 日志 =====
            window._logEntries = [];
            window._fightEntries = [];

            function switchLogTab(tab) {
                currentLogTab = tab;
                document.querySelectorAll('.log-tab').forEach(function (t) { t.classList.toggle('active', t.dataset.log === tab); });
                renderLogs();
            }

            function addLogEntry(log) {
                window._logEntries.push(log);
                if (window._logEntries.length > 500) window._logEntries = window._logEntries.slice(-500);
                if (currentLogTab !== 'normal') switchLogTab('normal');
                else appendLogToDOM(log);
            }
            function addFightEntry(log) {
                window._fightEntries.push(log);
                if (window._fightEntries.length > 500) window._fightEntries = window._fightEntries.slice(-500);
                if (currentLogTab !== 'fight') switchLogTab('fight');
                else appendFightToDOM(log);
            }

            // 战斗事件解析与渲染
            function parseFightEvent(msg) {
                var idx = msg.indexOf('{"type":');
                if (idx < 0) return null;
                try { return JSON.parse(msg.substring(idx)); }
                catch (e) { return null; }
            }

            function renderFightEvent(e) {
                switch (e.type) {
                    case 'start': return renderFightStart(e);
                    case 'round': return '<div class="fight-round">— 回合 ' + e.round + ' —</div>';
                    case 'skill': return renderSkill(e);
                    case 'pet_in': return renderPetIn(e);
                    case 'pet_out': return renderPetOut(e);
                    case 'item': return renderItem(e);
                    case 'over': return renderFightOver(e);
                    default: return '';
                }
            }

            function renderHpBar(hp, maxHp) {
                var pct = maxHp > 0 ? Math.round(hp / maxHp * 100) : 0;
                var cls = maxHp === 0 ? 'dead' : pct > 50 ? 'high' : pct > 25 ? 'mid' : 'low';
                var text = maxHp > 0 ? hp + '/' + maxHp : '战败';
                return '<div class="hp-bar-wrap">' +
                    '<div class="hp-bar"><div class="hp-bar-fill ' + cls + '" style="width:' + pct + '%"></div></div>' +
                    '<span class="hp-text">' + text + '</span></div>';
            }

            function renderFightStart(e) {
                var html = '<div class="fight-card"><div class="fight-card-title">⚔ 战斗开始</div>';
                // 我方所有精灵
                if (e.playerPets) {
                    for (var i = 0; i < e.playerPets.length; i++) {
                        html += '<div class="fight-pet-row">' +
                            '<span class="pet-tag player">我方</span>' +
                            '<span class="pet-name">' + escHtml(e.playerPets[i].name) + '</span>' +
                            renderHpBar(e.playerPets[i].hp, e.playerPets[i].maxHp) + '</div>';
                    }
                }
                // 敌方所有精灵
                if (e.enemyPets) {
                    for (var i = 0; i < e.enemyPets.length; i++) {
                        html += '<div class="fight-pet-row">' +
                            '<span class="pet-tag enemy">敌方</span>' +
                            '<span class="pet-name">' + escHtml(e.enemyPets[i].name) + '</span>' +
                            renderHpBar(e.enemyPets[i].hp, e.enemyPets[i].maxHp) + '</div>';
                    }
                }
                html += '</div>';
                return html;
            }

            function renderSkill(e) {
                var tags = e.isPlayer ? { cls: 'player', txt: '我方' } : { cls: 'enemy', txt: '敌方' };
                var s = e.skill;
                var html = '<div class="fight-skill-row">' +
                    '<span class="pet-tag ' + tags.cls + '">' + tags.txt + '</span>' +
                    '<span class="pet-name">' + escHtml(e.pet.name) + '</span>';
                if (s.name) {
                    html += '<span class="skill-name">' + escHtml(s.name) + '</span>';
                    html += '<span class="skill-damage">造成 ' + s.damage + ' 伤害</span>';
                    if (s.isCrit) html += '<span class="skill-crit">暴击!</span>';
                    var extras = [];
                    if (s.gainDmg > 0) extras.push('粉伤+' + s.gainDmg);
                    if (s.realDmg > 0) extras.push('真伤+' + s.realDmg);
                    if (s.zhuiDmg > 0) extras.push('追击+' + s.zhuiDmg);
                    if (extras.length) html += '<span class="skill-extra">' + extras.join(' ') + '</span>';
                } else {
                    html += '<span class="skill-noop">未使用技能</span>';
                }
                html += '</div>';
                html += '<div class="fight-skill-hp">' + renderHpBar(s.petHp, s.petMaxHp) + '</div>';
                return html;
            }

            function renderPetIn(e) {
                var tags = e.isPlayer ? { cls: 'player', txt: '我方' } : { cls: 'enemy', txt: '敌方' };
                return '<div class="fight-pet-in">' +
                    '<span class="pet-tag ' + tags.cls + '">' + tags.txt + '</span>' +
                    '<span class="pet-name">' + escHtml(e.pet.name) + '</span> 出场' +
                    '<div class="fight-skill-hp">' + renderHpBar(e.pet.hp, e.pet.maxHp) + '</div></div>';
            }

            function renderPetOut(e) {
                var tags = e.isPlayer ? { cls: 'player', txt: '我方' } : { cls: 'enemy', txt: '敌方' };
                return '<div class="fight-pet-out">' +
                    '<span class="pet-tag ' + tags.cls + '">' + tags.txt + '</span>' +
                    '<span class="pet-name">' + escHtml(e.pet.name) + '</span> 战败 ✘</div>';
            }

            function renderItem(e) {
                var tags = e.isPlayer ? { cls: 'player', txt: '我方' } : { cls: 'enemy', txt: '敌方' };
                return '<div class="fight-item">' +
                    '<span class="pet-tag ' + tags.cls + '">' + tags.txt + '</span> 使用了 ' + escHtml(e.item.name) + '</div>';
            }

            function renderFightOver(e) {
                if (e.escape) return '<div class="fight-over escape">⇐ 战斗撤退</div>';
                if (e.win) return '<div class="fight-over win">✔ 战斗胜利</div>';
                return '<div class="fight-over lose">✘ 战斗失败</div>';
            }

            function appendFightToDOM(log) {
                var div = document.createElement('div');
                var event = parseFightEvent(log.message);
                if (event) {
                    div.className = 'fight-entry';
                    div.innerHTML = renderFightEvent(event);
                } else {
                    div.className = 'log-entry log-' + log.level;
                    div.textContent = log.message;
                }
                logContent.appendChild(div);
                logContent.scrollTop = logContent.scrollHeight;
            }

            function appendLogToDOM(log) {
                var div = document.createElement('div');
                div.className = 'log-entry log-' + log.level;
                div.textContent = log.message;
                logContent.appendChild(div);
                logContent.scrollTop = logContent.scrollHeight;
            }

            function renderLogs() {
                logContent.innerHTML = '';
                var entries = currentLogTab === 'fight' ? window._fightEntries : window._logEntries;
                var isFight = currentLogTab === 'fight';
                entries.forEach(function (log) {
                    if (isFight) appendFightToDOM(log);
                    else appendLogToDOM(log);
                });
            }

            // ===== 运行/停止 =====
            function beginRunUI() {
                window._logEntries = [];
                window._fightEntries = [];
                logContent.innerHTML = '';
                clearProgress();
                btnRun.disabled = true;
                btnStop.disabled = false;
                btnRun.textContent = '⏳ 运行中...';
            }

            function runRequestFailed(message) {
                window._logEntries.push({ level: 'ERROR', message: message });
                renderLogs();
                btnRun.disabled = false;
                btnStop.disabled = true;
                btnRun.textContent = currentTab === 'FACTOR' ? '▶ 运行已选因子' : '▶ 全部运行';
            }

            function startRun() {
                if (currentTab === 'FACTOR') {
                    showTabRunModal('FACTOR');
                    return;
                }
                var acc = $('account').value.trim();
                var pwd = $('password').value.trim();
                if (!acc || !pwd) { showToast('请输入米米号和密码'); return; }

                window._saveSeerAccountToList(acc, pwd);
                beginRunUI();

                fetch('/studio/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ account: acc, password: pwd })
                }).then(function (r) { return r.json(); }).then(function (data) {
                    if (data.error) runRequestFailed(data.error);
                }).catch(function (e) {
                    runRequestFailed('请求失败: ' + e.message);
                });
            }

            function stopRun() {
                openModal('stopConfirmModal');
            }

            function confirmStop() {
                closeModal('stopConfirmModal');
                fetch('/studio/stop', { method: 'POST' });
                btnStop.disabled = true;
            }

            function clearProgress() {
                scriptProgress = {};
                if (currentTab === 'FACTOR') renderFactorList();
                else renderScriptList();
            }

            // ===== 单独执行脚本 =====
            function executeSingleScript() {
                var s = currentScripts[contextTarget];
                if (!s) return;
                var acc = $('account').value.trim();
                var pwd = $('password').value.trim();
                if (!acc || !pwd) { showToast('请输入米米号和密码'); return; }

                window._saveSeerAccountToList(acc, pwd);
                beginRunUI();

                fetch('/studio/run_single', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        account: acc,
                        password: pwd,
                        file: s.file
                    })
                }).then(function (r) { return r.json(); }).then(function (data) {
                    if (data.error) runRequestFailed(data.error);
                }).catch(function (e) {
                    runRequestFailed('请求失败: ' + e.message);
                });
            }

            // ===== TAB长按弹出菜单 =====
            var tabContextMenu = $('tabContextMenu');
            var tabContextTarget = '';

            function bindTabLongPress(tab) {
                if (tab.dataset.tab === 'FACTOR') return;
                tab.addEventListener('touchstart', function (e) {
                    tabLongPressed = false;
                    var t = e.touches[0];
                    tabLongPressStartX = t.clientX;
                    tabLongPressStartY = t.clientY;
                    tabLongPressTimer = setTimeout(function () {
                        tabLongPressed = true;
                        showTabContextMenu(tabLongPressStartX, tabLongPressStartY, tab.dataset.tab);
                    }, 500);
                }, { passive: false });

                tab.addEventListener('touchmove', function (e) {
                    if (!tabLongPressTimer) return;
                    var t = e.touches[0];
                    if (Math.abs(t.clientX - tabLongPressStartX) > 10 || Math.abs(t.clientY - tabLongPressStartY) > 10) {
                        clearTimeout(tabLongPressTimer);
                        tabLongPressTimer = null;
                    }
                });

                tab.addEventListener('touchend', function () {
                    clearTimeout(tabLongPressTimer);
                    tabLongPressTimer = null;
                });

                tab.addEventListener('mousedown', function (e) {
                    tabLongPressed = false;
                    tabLongPressStartX = e.clientX;
                    tabLongPressStartY = e.clientY;
                    tabLongPressTimer = setTimeout(function () {
                        tabLongPressed = true;
                        showTabContextMenu(tabLongPressStartX, tabLongPressStartY, tab.dataset.tab);
                    }, 500);
                });

                tab.addEventListener('mousemove', function (e) {
                    if (!tabLongPressTimer) return;
                    if (Math.abs(e.clientX - tabLongPressStartX) > 10 || Math.abs(e.clientY - tabLongPressStartY) > 10) {
                        clearTimeout(tabLongPressTimer);
                        tabLongPressTimer = null;
                    }
                });

                tab.addEventListener('mouseup', function () {
                    clearTimeout(tabLongPressTimer);
                    tabLongPressTimer = null;
                });
            }

            function showTabContextMenu(x, y, tabType) {
                tabContextTarget = tabType;
                var menuW = 180, menuH = 100;
                if (x + menuW > window.innerWidth) x = window.innerWidth - menuW - 8;
                if (y + menuH > window.innerHeight) y = window.innerHeight - menuH - 8;
                tabContextMenu.style.left = Math.max(8, x) + 'px';
                tabContextMenu.style.top = Math.max(8, y) + 'px';
                tabContextMenu.classList.add('active');
            }

            function hideTabContextMenu() { tabContextMenu.classList.remove('active'); }

            function showTabRunModal(tabType) {
                if (tabType === 'FACTOR') {
                    $('tabRunMsg').textContent = '是否执行所有已勾选的因子任务？';
                } else {
                    var label = tabType === 'UNITY' ? 'UNITY' : 'FLASH';
                    $('tabRunMsg').textContent = '是否单独运行' + label + '端脚本？';
                }
                $('confirmTabRun').dataset.tab = tabType;
                openModal('tabRunModal');
            }

            function startTabRun(tabType) {
                closeModal('tabRunModal');
                if (tabType === 'FACTOR') {
                    startFactorCategoryRun();
                    return;
                }

                var acc = $('account').value.trim();
                var pwd = $('password').value.trim();
                if (!acc || !pwd) { showToast('请输入米米号和密码'); return; }

                window._saveSeerAccountToList(acc, pwd);
                beginRunUI();

                fetch('/studio/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ account: acc, password: pwd, type: tabType })
                }).then(function (r) { return r.json(); }).then(function (data) {
                    if (data.error) runRequestFailed(data.error);
                }).catch(function (e) {
                    runRequestFailed('请求失败: ' + e.message);
                });
            }

            // ===== 批量删除未选中脚本 =====
            function showBatchDelete(tabType) {
                var label = tabType === 'UNITY' ? 'UNITY' : 'FLASH';
                var uncheckedCount = 0;
                // 需要从服务端获取当前未选中的数量，这里先显示提示
                $('batchDeleteMsg').textContent = '将删除 ' + label + ' 分类下所有未勾选的脚本，不可撤销。';
                $('confirmBatchDelete').dataset.tab = tabType;
                openModal('batchDeleteModal');
            }

            function confirmBatchDelete() {
                var tabType = $('confirmBatchDelete').dataset.tab;
                closeModal('batchDeleteModal');

                fetch('/studio/delete_unchecked?type=' + tabType, { method: 'POST' })
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        if (data.ok) {
                            showToast('已删除 ' + data.deleted + ' 个未选中脚本');
                            window._logEntries.push({ level: 'INFO', message: '[操作] 已从' + tabType + '端删除 ' + data.deleted + ' 个未勾选脚本' });
                            if (currentLogTab === 'normal') renderLogs();
                            loadScripts();
                        } else {
                            showToast('删除失败: ' + (data.error || '未知错误'));
                        }
                    }).catch(function (e) {
                        showToast('请求失败: ' + e.message);
                    });
            }

            // ===== Toast =====
            var toastTimer;
            function showToast(msg) {
                var el = $('toast');
                el.textContent = msg;
                el.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2000);
            }

            // ===== 工具函数 =====
            function importFiles(fileList) {
                var results = [];
                for (var i = 0; i < fileList.length; i++) {
                    results.push(fileList[i]);
                }
                if (!results.length) return;

                var formData = new FormData();
                results.forEach(function (f) {
                    formData.append("files", f);
                });

                fetch("/studio/import", {
                    method: "POST",
                    body: formData
                }).then(function (r) { return r.json(); }).then(function (data) {
                    var okCount = 0;
                    var errMsgs = [];
                    data.forEach(function (item) {
                        if (item.status === "ok") {
                            okCount++;
                        } else {
                            errMsgs.push(item.file + ": " + item.error);
                        }
                    });
                    if (okCount > 0) {
                        showToast("成功导入 " + okCount + " 个脚本");
                        loadScripts();
                    }
                    if (errMsgs.length > 0) {
                        errMsgs.forEach(function (m) { showToast(m); });
                    }
                    loadScripts();
                }).catch(function (e) {
                    showToast("导入失败: " + e.message);
                });
            }


            function escHtml(s) {
                if (!s) return '';
                return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            // ===== 因子任务 =====
            function factorModeLabel(mode) {
                return { 1: '简单', 2: '普通', 3: '困难' }[mode] || '简单';
            }

            function loadFactors() {
                if (currentTab === 'FACTOR') {
                    factorList.innerHTML = '<div class="empty-state">加载因子中...</div>';
                    factorEmptyState.style.display = 'none';
                }
                fetch('/studio/factors')
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        factorItems = data || [];
                        renderFactorList();
                    })
                    .catch(function (e) {
                        factorItems = [];
                        renderFactorList();
                        showToast('加载因子失败: ' + e.message);
                    });
            }

            function renderFactorList() {
                if (!factorItems.length) {
                    factorList.innerHTML = '';
                    factorEmptyState.innerHTML = '<div>暂无因子数据</div>';
                    factorEmptyState.style.display = 'block';
                    return;
                }
                factorEmptyState.style.display = 'none';

                var html = '';
                factorItems.forEach(function (f, i) {
                    var status = scriptProgress['factor:' + f.id] || 'pending';
                    var statusText = { running: '🔄', success: '✅', failed: '❌', stopped: '⏹', pending: '' }[status];
                    html += '<div class="script-item" data-index="' + i + '">' +
                        '<input type="checkbox" class="script-checkbox factor-checkbox"' + (f.enabled ? ' checked' : '') + '>' +
                        '<div class="script-info">' +
                        '<div class="script-name" title="' + escHtml(f.name) + '">' + escHtml(f.name) + '</div>' +
                        '<div class="script-meta">' +
                        '<span class="script-type">因子</span>' +
                        '<span class="factor-list-meta">ID ' + f.id + '</span>' +
                        '<span class="factor-list-meta">' + f.stages + ' 关</span>' +
                        '</div>' +
                        '</div>' +
                        '<span class="script-status status-' + status + '">' + statusText + '</span>' +
                        '<span class="script-menu-btn factor-menu-btn">⋯</span>' +
                        '</div>';
                });
                factorList.innerHTML = html;

                factorList.querySelectorAll('.factor-checkbox').forEach(function (cb) {
                    cb.addEventListener('change', function () {
                        var idx = parseInt(cb.closest('.script-item').dataset.index);
                        var item = factorItems[idx];
                        item.enabled = cb.checked;
                        fetch('/studio/factor/enabled?id=' + item.id, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ enabled: cb.checked })
                        }).then(function (r) { return r.json(); }).then(function (data) {
                            if (data.error) throw new Error(data.error);
                        }).catch(function (e) {
                            item.enabled = !cb.checked;
                            cb.checked = !cb.checked;
                            showToast('保存失败: ' + e.message);
                        });
                    });
                });

                factorList.querySelectorAll('.factor-menu-btn').forEach(function (btn) {
                    btn.addEventListener('click', function (e) {
                        e.stopPropagation();
                        factorContextTarget = parseInt(btn.closest('.script-item').dataset.index);
                        showFactorContextMenu(e);
                    });
                });
            }

            function showFactorContextMenu(e) {
                var x = e.clientX || (e.touches && e.touches[0].clientX) || 0;
                var y = e.clientY || (e.touches && e.touches[0].clientY) || 0;
                var menuW = 140, menuH = 130;
                if (x + menuW > window.innerWidth) x = window.innerWidth - menuW - 8;
                if (y + menuH > window.innerHeight) y = window.innerHeight - menuH - 8;
                factorContextMenu.style.left = Math.max(8, x) + 'px';
                factorContextMenu.style.top = Math.max(8, y) + 'px';
                factorContextMenu.classList.add('active');
            }

            function hideFactorContextMenu() {
                factorContextMenu.classList.remove('active');
            }

            function showFactorDesc() {
                var f = factorItems[factorContextTarget];
                if (!f) return;
                $('descTitle').textContent = '因子说明';
                $('descContent').innerHTML = '<p style="margin-bottom:10px;"><strong>' + escHtml(f.name) + '</strong></p>' +
                    '<p>' + (f.desc ? escHtml(f.desc).replace(/\n/g, '<br>') : '该因子没有说明。') + '</p>';
                openModal('descModal');
            }

            function executeFactorItem() {
                var f = factorItems[factorContextTarget];
                if (!f) return;
                if (btnRun.disabled) { showToast('已有任务正在运行'); return; }

                var acc = $('account').value.trim();
                var pwd = $('password').value.trim();
                if (!acc || !pwd) { showToast('请输入米米号和密码'); return; }

                window._saveSeerAccountToList(acc, pwd);
                beginRunUI();

                fetch('/studio/factor/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ account: acc, password: pwd, id: f.id })
                }).then(function (r) { return r.json(); }).then(function (data) {
                    if (data.error) runRequestFailed(data.error);
                }).catch(function (e) {
                    runRequestFailed('请求失败: ' + e.message);
                });
            }

            function startFactorCategoryRun() {
                var acc = $('account').value.trim();
                var pwd = $('password').value.trim();
                if (!acc || !pwd) { showToast('请输入米米号和密码'); return; }
                if (!factorItems.some(function (f) { return f.enabled; })) {
                    showToast('请先勾选要执行的因子');
                    return;
                }

                window._saveSeerAccountToList(acc, pwd);
                beginRunUI();

                fetch('/studio/factor/run_category', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ account: acc, password: pwd })
                }).then(function (r) { return r.json(); }).then(function (data) {
                    if (data.error) runRequestFailed(data.error);
                }).catch(function (e) {
                    runRequestFailed('请求失败: ' + e.message);
                });
            }

            // ===== 因子设置 =====
            function showFactorSettings() {
                var f = factorItems[factorContextTarget];
                if (!f) return;

                factorSettingsTarget = factorContextTarget;
                factorSettingsData = null;
                factorStageDraft = [];
                $('factorSettingsContent').innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:20px;">加载中...</p>';
                openModal('factorSettingsModal');

                loadFightEditorFiles(function () {
                    fetch('/studio/factor/settings?id=' + f.id)
                        .then(function (r) { return r.json(); })
                        .then(function (data) {
                            if (data.error) throw new Error(data.error);
                            factorSettingsData = data;
                            factorModalMode = data.mode;
                            factorStageDraft = (data.stages || []).map(function (stage) {
                                return { port: stage.port || 'UNITY', plan: stage.plan || '' };
                            });
                            renderFactorSettings();
                        })
                        .catch(function (e) {
                            $('factorSettingsContent').innerHTML = '<p style="color:var(--danger);text-align:center;padding:20px;">' +
                                escHtml(e.message) + '</p>';
                        });
                });
            }

            function captureFactorSettingsInputs() {
                if (!factorSettingsData) return;
                var speed = $('factorSpeedrun');
                if (speed) factorSettingsData.speedrun = speed.classList.contains('on');
                var fail = $('factorFailTimes');
                if (fail && fail.value !== '') {
                    var value = parseInt(fail.value);
                    if (!isNaN(value) && value >= 0) factorSettingsData.failTimes = value;
                }
            }

            function captureFactorStages() {
                var stages = [];
                document.querySelectorAll('#factorSettingsContent .factor-stage-row').forEach(function (row) {
                    stages.push({
                        port: row.querySelector('.stage-port').value,
                        plan: row.querySelector('.stage-plan').value
                    });
                });
                return stages;
            }

            function resizeFactorDraft(count) {
                var next = [];
                for (var i = 0; i < count; i++) {
                    next.push(factorStageDraft[i] || { port: 'UNITY', plan: '' });
                }
                factorStageDraft = next;
            }

            function selectFactorMode(el) {
                var mode = parseInt(el.dataset.mode);
                if (!mode || mode === factorModalMode || !factorSettingsData) return;
                captureFactorSettingsInputs();
                factorStageDraft = captureFactorStages();
                factorModalMode = mode;
                renderFactorSettings();
            }
            window.selectFactorMode = selectFactorMode;

            function setFactorPlanValue(sel, plan) {
                if (!plan) return;
                var exists = Array.prototype.some.call(sel.options, function (opt) { return opt.value === plan; });
                if (!exists) {
                    var option = document.createElement('option');
                    option.value = plan;
                    option.textContent = plan + '（未找到）';
                    sel.appendChild(option);
                }
                sel.value = plan;
            }

            function renderFactorSettings() {
                if (!factorSettingsData) return;

                var modeCounts = factorSettingsData.modeStages || {};
                var count = parseInt(modeCounts[String(factorModalMode)] || 0);
                resizeFactorDraft(count);

                var previewName = factorModeLabel(factorModalMode) + '-' + factorSettingsData.factorName;
                var html = '<div class="factor-settings-head">' +
                    '<span class="name">' + escHtml(previewName) + '</span>' +
                    '<span class="sub">ID ' + factorItems[factorSettingsTarget].id + '</span>' +
                    '</div>';

                html += '<div class="factor-section">' +
                    '<div class="factor-section-title">挑战难度</div>' +
                    '<div class="factor-mode-chips">';
                [1, 2, 3].forEach(function (mode) {
                    html += '<div class="factor-mode-chip' + (mode === factorModalMode ? ' selected' : '') +
                        '" data-mode="' + mode + '" onclick="selectFactorMode(this)">' + factorModeLabel(mode) + '</div>';
                });
                html += '</div></div>';

                html += '<div class="factor-section"><div class="factor-options-row">' +
                    '<div><span class="factor-option-label">优先扫荡</span>' +
                    '<div class="toggle-switch' + (factorSettingsData.speedrun ? ' on' : '') +
                    '" id="factorSpeedrun" onclick="toggleSwitch(this)"></div></div>' +
                    '<div><label class="factor-option-label" for="factorFailTimes">允许失败次数</label>' +
                    '<input class="factor-number-input" type="number" id="factorFailTimes" min="0" step="1" value="' +
                    (factorSettingsData.failTimes != null ? factorSettingsData.failTimes : 10) + '"></div>' +
                    '</div></div>';

                html += '<div class="factor-section"><div class="factor-section-title">关卡设置</div><div class="factor-stages">';
                for (var i = 0; i < count; i++) {
                    var stage = factorStageDraft[i] || { port: 'UNITY', plan: '' };
                    html += '<div class="factor-stage-row" data-stage="' + i + '">' +
                        '<label>第' + (i + 1) + '关</label>' +
                        '<select class="stage-port">' +
                        '<option value="UNITY"' + (stage.port !== 'FLASH' ? ' selected' : '') + '>UNITY</option>' +
                        '<option value="FLASH"' + (stage.port === 'FLASH' ? ' selected' : '') + '>FLASH</option>' +
                        '</select>' +
                        '<select class="stage-plan"></select>' +
                        '</div>';
                }
                if (count === 0) {
                    html += '<p style="color:var(--text-muted);font-size:14px;">该难度没有可挑战的关卡。</p>';
                }
                html += '</div></div>';

                $('factorSettingsContent').innerHTML = html;
                document.querySelectorAll('#factorSettingsContent .stage-plan').forEach(function (sel, i) {
                    fillFightSelect(sel);
                    setFactorPlanValue(sel, factorStageDraft[i] ? factorStageDraft[i].plan : '');
                });
            }

            function saveFactorSettings() {
                if (!factorSettingsData || factorSettingsTarget < 0) return;

                var failInput = $('factorFailTimes');
                var failTimes = parseInt(failInput.value);
                if (isNaN(failTimes) || failTimes < 0) {
                    showToast('允许失败次数不能小于 0');
                    failInput.focus();
                    return;
                }

                var stages = captureFactorStages();
                var payload = {
                    mode: factorModalMode,
                    speedrun: $('factorSpeedrun').classList.contains('on'),
                    failTimes: failTimes,
                    stages: stages
                };
                var f = factorItems[factorSettingsTarget];
                var btn = $('saveFactorSettings');
                btn.disabled = true;

                fetch('/studio/factor/settings?id=' + f.id, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).then(function (r) { return r.json(); }).then(function (data) {
                    btn.disabled = false;
                    if (data.error) {
                        showToast('保存失败: ' + data.error);
                        return;
                    }
                    closeModal('factorSettingsModal');
                    var missing = stages.findIndex(function (stage) { return !stage.plan; });
                    if (missing >= 0) {
                        showToast('已保存，第' + (missing + 1) + '关尚未选择挑战方案');
                    } else {
                        showToast('设置已保存');
                    }
                    loadFactors();
                }).catch(function (e) {
                    btn.disabled = false;
                    showToast('保存失败: ' + e.message);
                });
            }

            init();
        })();
    </script>
</body>

</html>
